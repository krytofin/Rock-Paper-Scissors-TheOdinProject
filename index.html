<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <div class="display">
        <p>Current score: you <span id="player_score"></span>, computer: <span id="computer_score"></span></p>
        <p>You selected: <span id="player_selection"></span></p>
        <p>Computer selected: <span id="computer_selection"></span></p>
        <p id="game_status">Status</p>
    </div>
    <div class="buttons">
        <button class="play_btn">Rock</button>
        <button class="play_btn">Paper</button>
        <button class="play_btn">Scissors</button>
    </div>
    <script src="script.js" defer>
    </script> 
</body>
</html>
